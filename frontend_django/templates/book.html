{% extends "base.html" %}

{% block content %}

<div class="page-shell">
    <section class="hero center fade-up">
        <div class="eyebrow">Appointment Request</div>
        <h1>Book <span>Appointment</span></h1>
        <p>Confirm your details and submit your request to the doctor.</p>
    </section>

    <form method="POST" class="panel fade-up" style="max-width:680px;margin:auto">
        {% csrf_token %}

        <label>Specialist</label>
        <input type="text" value="{{ specialist }}" readonly>

        <label>Slot Time</label>
        <input type="text" value="{{ slot.time }}" readonly>

        <label>Patient Name</label>
        <input type="text" name="name" placeholder="Enter patient name" required>

        <label>Age</label>
        <input type="number" name="age" placeholder="Enter age" required>

        <label>Reason</label>
        <textarea name="reason" placeholder="Reason for appointment" required></textarea>

        <button class="btn full" type="submit">Confirm Booking →</button>
    </form>
</div>

{% endblock %}
